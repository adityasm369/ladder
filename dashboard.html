<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbfaf7; --ink:#14130f; --soft:#5d5a52; --faint:#96938a;
  --line:#e7e4dc; --card:#ffffff;
  --gold:#a67c1a; --gold-soft:#f6efdf;
  --green:#2f6d4a; --red:#a33a2b;
  --r:14px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#100f0d; --ink:#f2efe8; --soft:#a8a49a; --faint:#75726a;
  --line:#292722; --card:#16150f;
  --gold:#d6a63a; --gold-soft:#241d0c;
  --green:#5fae83; --red:#e0796a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.65 Inter,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:Fraunces,Georgia,serif;font-weight:400;letter-spacing:-.01em}
a{color:inherit}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hin{max-width:1120px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:14px}
.brand{font-family:Fraunces,serif;font-size:20px;letter-spacing:.02em}
.brand b{font-weight:600}
.hsub{color:var(--faint);font-size:12.5px}
.spacer{flex:1}
.hbtn{border:1px solid var(--line);background:var(--card);color:var(--soft);
  border-radius:999px;padding:6px 13px;font:inherit;font-size:12.5px;cursor:pointer}
.hbtn:hover{border-color:var(--gold);color:var(--gold)}
nav.tabs{max-width:1120px;margin:0 auto;padding:0 22px;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{border:0;background:none;color:var(--soft);font:inherit;font-size:13.5px;
  padding:11px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
main{max-width:1120px;margin:0 auto;padding:26px 22px 90px}
.view{display:none} .view.on{display:block}
.lede{font-family:Fraunces,serif;font-size:clamp(23px,3.2vw,31px);line-height:1.28;
  max-width:24ch;margin:0 0 6px}
.sub{color:var(--soft);font-size:13.5px;margin:0 0 22px;max-width:62ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  font-weight:600;margin-bottom:7px}
input,textarea,select{width:100%;background:var(--paper);color:var(--ink);
  border:1px solid var(--line);border-radius:9px;padding:8px 11px;font:inherit;font-size:14px}
textarea{resize:vertical;line-height:1.6}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold)}
button.act{background:var(--ink);color:var(--paper);border:0;border-radius:9px;
  padding:9px 16px;font:inherit;font-weight:500;cursor:pointer}
button.act:hover{background:var(--gold)}
button.mini{background:none;border:1px solid var(--line);color:var(--soft);
  border-radius:8px;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer}
button.mini:hover{border-color:var(--gold);color:var(--gold)}
button.x{background:none;border:0;color:var(--faint);cursor:pointer;font-size:15px;padding:0 4px}
button.x:hover{color:var(--red)}

/* ---- the ladder ---- */
.rung{display:grid;grid-template-columns:56px 1fr;gap:16px;padding:16px 0;
  border-bottom:1px solid var(--line)}
.rung:last-child{border-bottom:0}
.rung .yr{font-family:Fraunces,serif;font-size:19px;color:var(--gold)}
.rung .yr small{display:block;font-family:Inter,sans-serif;font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.rung h3{margin:0 0 3px;font-size:17px}
.rung .gap{color:var(--soft);font-size:13.5px;margin:2px 0 8px}
.rung .nxt{font-size:13.5px;background:var(--gold-soft);border-radius:8px;
  padding:7px 11px;display:inline-block}
.rung.done h3{text-decoration:line-through;color:var(--faint)}

/* ---- gaps ---- */
.gaprow{padding:13px 0;border-bottom:1px solid var(--line)}
.gaprow:last-child{border-bottom:0}
.gaphead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.gaphead b{font-size:15px}
.gapnum{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--soft);font-size:13px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--gold)}
.gapnote{color:var(--faint);font-size:12.5px;margin-top:6px}

/* ---- practice ---- */
.streak{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.streak span{width:13px;height:13px;border-radius:3px;background:var(--line)}
.streak span.hit{background:var(--gold)}
.affirm{font-family:Fraunces,serif;font-size:clamp(19px,2.6vw,25px);line-height:1.45;
  margin:0;max-width:34ch}
.tick{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
.tick:last-child{border-bottom:0}
.tick input{width:auto}

/* ---- meditation ---- */
.timer{font-family:Fraunces,serif;font-size:64px;line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.chakra{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ch{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;
  cursor:pointer;color:var(--soft)}
.ch.on{border-color:currentColor;font-weight:600}

/* ---- calendar ---- */
.evrow{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.evrow:last-child{border-bottom:0}
.evd{font-variant-numeric:tabular-nums;color:var(--gold);font-size:13px;min-width:92px}
.evk{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.soon{color:var(--red);font-weight:600}

/* ---- counsel ---- */
.lens{border-left:3px solid var(--gold);padding:2px 0 2px 15px;margin-bottom:18px}
.lens h4{margin:0 0 4px;font-family:Fraunces,serif;font-size:16px;font-weight:400}
.lens .src{color:var(--faint);font-size:11.5px;margin-bottom:6px}
.lens p{margin:0;color:var(--soft);font-size:14px}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.saved{color:var(--faint);font-size:12px}
@media(max-width:640px){ .rung{grid-template-columns:44px 1fr;gap:11px} }
/* ---- this week ---- */
.wk{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.wk:last-of-type{border-bottom:0}
.wk input{width:auto;margin-top:3px;flex:0 0 auto}
.wk b{font-weight:600}
.wkw{color:var(--soft);font-size:13px;line-height:1.55}
/* ---- wall ---- */
.cloud{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;
  font-family:Fraunces,serif;line-height:1.35;padding:6px 0}
.cloud span{color:var(--gold)}
.cloud span:nth-child(3n){color:var(--ink)}
.cloud span:nth-child(4n){color:var(--soft)}
.chipx{border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 11px;
  font-size:12.5px;color:var(--soft);display:inline-flex;align-items:center;gap:2px}
.wallgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:12px;margin-top:14px}
.wallit{margin:0;border:1px solid var(--line);border-radius:11px;overflow:hidden;
  background:var(--paper)}
.wallit img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}
.wallit figcaption{font-size:12.5px;color:var(--soft);padding:8px 10px;
  display:flex;gap:6px;align-items:center}
.wallit figcaption .x{margin-left:auto}
/* ---- news ---- */
.ncat{margin:26px 0 10px;font-family:Fraunces,serif;font-size:19px}
.ncat:first-of-type{margin-top:6px}
.nrow{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.nrow:last-child{border-bottom:0}
.nrow a{text-decoration:none;flex:1;line-height:1.5}
.nrow a:hover{color:var(--gold)}
.nsrc{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
  white-space:nowrap;min-width:104px}
</style>
</head>
<body>

<header>
  <div class="hin">
    <div>
      <div class="brand">The <b>Ladder</b></div>
      <div class="hsub" id="hsub">loading…</div>
    </div>
    <div class="spacer"></div>
    <span class="saved" id="saved"></span>
    <button class="hbtn" id="toneBtn" title="A steady 369 Hz tone, kept low">369 Hz</button>
    <button class="hbtn" id="themeBtn">Dark</button>
  </div>
  <nav class="tabs" id="tabs">
    <button data-v="today" class="on">Today</button>
    <button data-v="week">This week</button>
    <button data-v="ladder">The Ladder</button>
    <button data-v="gaps">Golden gaps</button>
    <button data-v="practice">Practice</button>
    <button data-v="sit">Sit</button>
    <button data-v="calendar">Calendar</button>
    <button data-v="counsel">Counsel</button>
    <button data-v="news">Good news</button>
    <button data-v="wall">Wall of fame</button>
  </nav>
</header>

<main>
  <div class="view on" id="v-today"></div>
  <div class="view" id="v-ladder"></div>
  <div class="view" id="v-gaps"></div>
  <div class="view" id="v-practice"></div>
  <div class="view" id="v-sit"></div>
  <div class="view" id="v-calendar"></div>
  <div class="view" id="v-week"></div>
  <div class="view" id="v-counsel"></div>
  <div class="view" id="v-news"></div>
  <div class="view" id="v-wall"></div>
</main>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);

/* ---------------- state ----------------
   One document, held on the server behind the sign-in. Everything on this
   page is editable; nothing here is hard-coded content pretending to be
   yours. */
let S = null, dirty = false;

const SEED = {
  who:{name:"", role:"", since:""},
  horizon:"2031-03-31",
  vision:"",
  rungs:[], gaps:[], affirmations:[], practices:[], events:[],
  log:{},          // "YYYY-MM-DD": {intention, review, done:[practice ids]}
};

async function load(){
  try{
    const d = await fetch("/api/state").then(r=>r.ok?r.json():{});
    S = Object.assign(structuredClone(SEED), d||{});
  }catch(e){ S = structuredClone(SEED); }
  if(!S.rungs.length) firstRun();
  paint();
}
let saveTimer=null;
function save(){
  dirty=true; $("#saved").textContent="…";
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{
      await fetch("/api/state",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify(S)});
      dirty=false;
      $("#saved").textContent="saved";
      setTimeout(()=>{ if(!dirty) $("#saved").textContent=""; }, 1800);
    }catch(e){ $("#saved").textContent="not saved"; }
  }, 700);
}

/* A starting shape, not a prescription: every line is editable and several
   are deliberately blank, because a ladder someone else wrote is not yours. */
function firstRun(){
  const y=new Date().getFullYear();
  S.who={name:"Aditya Sriram Mattaparthi", role:"Software Principal Engineer, Dell Technologies", since:String(y)};
  S.vision="";
  S.rungs=[
    {y:String(y),   t:"Where I stand", gap:"", nxt:"", done:false},
    {y:String(y+1), t:"", gap:"", nxt:"", done:false},
    {y:String(y+2), t:"", gap:"", nxt:"", done:false},
    {y:String(y+3), t:"", gap:"", nxt:"", done:false},
    {y:String(y+5), t:"The horizon", gap:"", nxt:"", done:false},
  ];
  S.gaps=[
    {n:"", have:0, want:0, unit:"", note:""},
  ];
  S.affirmations=[];
  S.practices=[
    {id:"p1", t:"Sit — 20 minutes"},
    {id:"p2", t:"Read one page and act on one line"},
    {id:"p3", t:"One conversation that moves a rung"},
  ];
  S.events=[];
  save();
}

/* ---------------- tabs ---------------- */
$("#tabs").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  $$("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
  $$(".view").forEach(v=>v.classList.remove("on"));
  $("#v-"+b.dataset.v).classList.add("on");
  window.scrollTo({top:0});
});

/* ---------------- theme + tone ---------------- */
$("#themeBtn").onclick=()=>{
  const dark=document.documentElement.dataset.theme==="dark";
  document.documentElement.dataset.theme=dark?"light":"dark";
  $("#themeBtn").textContent=dark?"Dark":"Light";
  localStorage.setItem("ladder.theme",document.documentElement.dataset.theme);
};
if(localStorage.getItem("ladder.theme")==="dark"){
  document.documentElement.dataset.theme="dark"; }

let TONE=null, TONE_ON=false;
function toneToggle(on){
  try{
    if(on){
      if(!TONE){
        const ctx=new (window.AudioContext||window.webkitAudioContext)();
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.type="sine"; o.frequency.value=369; g.gain.value=0;
        o.connect(g).connect(ctx.destination); o.start();
        g.gain.linearRampToValueAtTime(0.012, ctx.currentTime+2.5);
        TONE={ctx,o,g};
      } else { TONE.ctx.resume();
        TONE.g.gain.linearRampToValueAtTime(0.012, TONE.ctx.currentTime+1.5); }
      TONE_ON=true;
    } else if(TONE){
      TONE.g.gain.linearRampToValueAtTime(0, TONE.ctx.currentTime+0.6); TONE_ON=false;
    }
    localStorage.setItem("ladder.tone", TONE_ON?"1":"0");
  }catch(e){}
  $("#toneBtn").textContent = TONE_ON ? "369 Hz ⏸" : "369 Hz";
}
$("#toneBtn").onclick=()=>toneToggle(!TONE_ON);

/* ---------------- painting ---------------- */
function paint(){ hdr(); today_(); week(); news(); ladder(); gaps(); practice(); sit(); calendar_(); counsel(); wall(); }

function hdr(){
  const d=new Date(S.horizon||"");
  const days=isNaN(d)?null:Math.ceil((d-new Date())/864e5);
  $("#hsub").textContent = (S.who.role||"") + (days!=null?` · ${days.toLocaleString()} days to the horizon`:"");
}

/* ---- Today ---- */
function today_(){
  const k=today(), e=S.log[k]||{};
  const aff = S.affirmations.length
    ? S.affirmations[new Date().getDate() % S.affirmations.length] : "";
  const open = S.rungs.find(r=>!r.done && r.nxt);
  $("#v-today").innerHTML=`
  <p class="lede">${esc(new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"}))}</p>
  <p class="sub">One page. What you intend before the day starts, and what actually happened when it ended.</p>
  <div class="grid g2">
    <div class="card">
      <div class="lbl">Intention</div>
      <textarea id="tIntent" rows="3" placeholder="The one thing that would make today count.">${esc(e.intention||"")}</textarea>
      <div class="lbl" style="margin-top:16px">Tonight</div>
      <textarea id="tReview" rows="3" placeholder="What actually moved. What did not, and why.">${esc(e.review||"")}</textarea>
    </div>
    <div class="card">
      ${aff?`<div class="lbl">Today's line</div><p class="affirm">${esc(aff)}</p>`
           :`<div class="lbl">Today's line</div><p class="sub" style="margin:0">Add your affirmations under Practice and one will appear here each day.</p>`}
      ${open?`<div class="lbl" style="margin-top:20px">Next on the ladder</div>
        <p style="margin:0"><b>${esc(open.t||open.y)}</b><br><span class="sub" style="margin:0">${esc(open.nxt)}</span></p>`:""}
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    <div class="lbl">Practice</div>
    ${S.practices.map(p=>`<label class="tick">
      <input type="checkbox" data-p="${esc(p.id)}" ${(e.done||[]).includes(p.id)?"checked":""}>
      <span>${esc(p.t)}</span></label>`).join("") || `<p class="sub" style="margin:0">No practices yet — add them under Practice.</p>`}
    <div class="streak" id="streak"></div>
    <div class="gapnote">Last thirty days. A gap is information, not a verdict.</div>
  </div>`;

  $("#tIntent").oninput=e2=>{ log().intention=e2.target.value; save(); };
  $("#tReview").oninput=e2=>{ log().review=e2.target.value; save(); };
  $$("#v-today input[data-p]").forEach(cb=>cb.onchange=()=>{
    const l=log(); l.done=l.done||[];
    const id=cb.dataset.p;
    if(cb.checked){ if(!l.done.includes(id)) l.done.push(id); }
    else l.done=l.done.filter(x=>x!==id);
    save(); streak();
  });
  streak();
}
function log(){ const k=today(); S.log[k]=S.log[k]||{}; return S.log[k]; }
function streak(){
  const el=$("#streak"); if(!el) return;
  let h="";
  for(let i=29;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const k=d.toISOString().slice(0,10);
    const done=((S.log[k]||{}).done||[]).length;
    h+=`<span class="${done?"hit":""}" title="${k}"></span>`;
  }
  el.innerHTML=h;
}

/* ---- The Ladder ---- */
function ladder(){
  $("#v-ladder").innerHTML=`
  <p class="lede">The climb, one rung at a time</p>
  <p class="sub">A rung is not a wish. It is a named position, the honest gap between here and it,
    and the next thing that closes some of that gap. Edit anything.</p>
  <div class="card">
    <div class="lbl">The horizon</div>
    <div class="row">
      <input id="lHorizon" type="date" value="${esc(S.horizon||"")}" style="max-width:190px">
      <input id="lVision" placeholder="What is true when you arrive" value="${esc(S.vision||"")}">
    </div>
  </div>
  <div class="card" style="margin-top:14px">
    ${S.rungs.map((r,i)=>`<div class="rung ${r.done?"done":""}">
      <div class="yr">${esc(r.y||"")}<small>${r.done?"done":"open"}</small></div>
      <div>
        <div class="row" style="gap:6px">
          <input data-i="${i}" data-f="t" value="${esc(r.t)}" placeholder="The position you hold at this rung"
            style="font-weight:600;border-color:transparent;background:none;padding-left:0">
          <button class="x" data-del="${i}" title="Remove">×</button>
        </div>
        <input data-i="${i}" data-f="gap" value="${esc(r.gap)}" placeholder="The golden gap — what is missing between here and there"
          style="border-color:transparent;background:none;padding-left:0;color:var(--soft);font-size:13.5px">
        <input data-i="${i}" data-f="nxt" value="${esc(r.nxt)}" placeholder="The next action that closes some of it"
          style="border-color:transparent;background:none;padding-left:0;font-size:13.5px">
        <div class="row" style="margin-top:6px">
          <label class="tick" style="border:0;padding:0"><input type="checkbox" data-done="${i}" ${r.done?"checked":""}>
            <span class="gapnote">reached</span></label>
        </div>
      </div>
    </div>`).join("")}
    <div class="row" style="margin-top:14px">
      <button class="mini" id="lAdd">+ Add a rung</button>
    </div>
  </div>`;

  $("#lHorizon").onchange=e=>{ S.horizon=e.target.value; save(); hdr(); };
  $("#lVision").oninput=e=>{ S.vision=e.target.value; save(); };
  $$("#v-ladder input[data-f]").forEach(i=>i.oninput=()=>{
    S.rungs[+i.dataset.i][i.dataset.f]=i.value; save(); });
  $$("#v-ladder input[data-done]").forEach(c=>c.onchange=()=>{
    S.rungs[+c.dataset.done].done=c.checked; save(); ladder(); today_(); });
  $$("#v-ladder [data-del]").forEach(b=>b.onclick=()=>{
    S.rungs.splice(+b.dataset.del,1); save(); ladder(); });
  $("#lAdd").onclick=()=>{
    const y=new Date().getFullYear()+S.rungs.length;
    S.rungs.push({y:String(y),t:"",gap:"",nxt:"",done:false}); save(); ladder(); };
}

/* ---- Golden gaps ---- */
function gaps(){
  $("#v-gaps").innerHTML=`
  <p class="lede">The distance, stated honestly</p>
  <p class="sub">A gap you can measure is a gap you can close. Put the real number in
    <em>have</em> — the value of this page is that it does not flatter you.</p>
  <div class="card">
    ${S.gaps.map((g,i)=>{
      const pc = (+g.want>0) ? Math.max(0,Math.min(100, (+g.have/ +g.want)*100)) : 0;
      const mult = (+g.have>0 && +g.want>0) ? (+g.want / +g.have) : null;
      return `<div class="gaprow">
        <div class="gaphead">
          <input data-i="${i}" data-f="n" value="${esc(g.n)}" placeholder="What you are measuring"
            style="border-color:transparent;background:none;padding-left:0;font-weight:600;max-width:340px">
          <span class="gapnum">${mult?`${mult>=1000?Math.round(mult).toLocaleString():mult.toFixed(1)}× to go`:""}</span>
          <button class="x" data-del="${i}">×</button>
        </div>
        <div class="row" style="gap:8px;margin-top:4px">
          <input data-i="${i}" data-f="have" value="${esc(g.have)}" placeholder="have" style="max-width:130px">
          <span class="gapnote">of</span>

function poolState(k){
  S.pools = S.pools || {};
  const P = POOLS[k];
  if(!S.pools[k]){
    S.pools[k] = {shown: P.items.slice(0, P.n).map(x=>x[0]), done: [], queued: []};
  }
  return S.pools[k];
}

/* Anything queued yesterday or earlier is due this morning. */
function ripen(){
  let changed = false;
  for(const k of Object.keys(POOLS)){
    const st = poolState(k);
    const due = st.queued.filter(q => q.at <= today());
    if(due.length){
      st.queued = st.queued.filter(q => q.at > today());
      due.forEach(q => { if(!st.shown.includes(q.t)) st.shown.push(q.t); });
      changed = true;
    }
  }
  if(changed) save();
}

function tickPool(k, title){
  const P = POOLS[k], st = poolState(k);
  st.shown = st.shown.filter(t => t !== title);
  st.done.push({t: title, on: today()});
  // The replacement is the first pool item neither shown, done, nor queued.
  const taken = new Set([...st.shown, ...st.done.map(d=>d.t), ...st.queued.map(q=>q.t)]);
  const next = P.items.map(x=>x[0]).find(t => !taken.has(t));
  if(next){
    const d = new Date(); d.setDate(d.getDate()+1);
    st.queued.push({t: next, at: d.toISOString().slice(0,10)});
  }
  save(); week();
}

function week(){
  ripen();
  const blocks = Object.keys(POOLS).map(k => {
    const P = POOLS[k], st = poolState(k);
    const byTitle = Object.fromEntries(P.items);
    const rows = st.shown.map(t => `
      <label class="wk">
        <input type="checkbox" data-k="${esc(k)}" data-t="${esc(t)}">
        <span><b>${esc(t)}</b><br><span class="wkw">${esc(byTitle[t]||"")}</span></span>
      </label>`).join("") ||
      `<p class="sub" style="margin:0">Nothing waiting — the pool is empty. Add your own below.</p>`;
    const soon = st.queued.length
      ? `<div class="gapnote">${st.queued.length} arriving tomorrow morning</div>` : "";
    const done = st.done.length
      ? `<div class="gapnote">${st.done.length} done so far</div>` : "";
    return `<div class="card" style="margin-bottom:14px">
      <div class="lbl">${esc(P.title)}</div>
      <p class="sub" style="margin:-2px 0 12px">${esc(P.note)}</p>
      ${rows}${soon}${done}
    </div>`;
  }).join("");

  $("#v-week").innerHTML = `
    <p class="lede">This week</p>
    <p class="sub">Tick something and its replacement arrives tomorrow morning, not this second.
      The point is to finish a week having done five things, not to keep a list moving.</p>
    ${blocks}`;

  $$("#v-week input[data-k]").forEach(cb => cb.onchange = () => {
    if(cb.checked) tickPool(cb.dataset.k, cb.dataset.t);
  });
}

/* Resized here, before anything is sent: a phone photograph is several
   megabytes and the store is one document. 900px wide is more than a wall
   tile ever needs. */
function addImages(files){
  [...files].slice(0, 6).forEach(f => {
    if(!f.type.startsWith("image/")) return;
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const max = 900, sc = Math.min(1, max/Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width*sc); c.height = Math.round(im.height*sc);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        S.wall.unshift({img: c.toDataURL("image/jpeg", 0.72), t: f.name.replace(/\.[^.]+$/,"")});
        save(); wall();
      };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  });
}


/* ============ GOOD NEWS ============
   Public RSS, read on the server and filtered towards success, growth and
   life. Headlines and links only -- the article belongs to whoever wrote it,
   and this page's job is to point you at them.

   The filter is keyword-based, which is crude. It errs towards holding things
   back: a page of good news that lets one grim headline through has failed at
   the only thing it was for. */
let NEWS_CACHE = null;
async function news(force){
  const el = $("#v-news");
  if(!el) return;
  if(!NEWS_CACHE || force){
    el.innerHTML = `<p class="lede">Good news</p><p class="sub">Reading the feeds…</p>`;
    try{ NEWS_CACHE = await fetch("/api/news").then(r=>r.json()); }
    catch(e){ NEWS_CACHE = {ok:false}; }
  }
  const d = NEWS_CACHE;
  if(!d || !d.ok || !(d.items||[]).length){
    el.innerHTML = `<p class="lede">Good news</p>
      <p class="sub">Nothing came back from the feeds just now. It refreshes every half hour.</p>
      <button class="mini" id="nRe">Try again</button>`;
    const b=$("#nRe"); if(b) b.onclick=()=>news(true);
    return;
  }
  const order = ["Technology","Indian companies","Health","Life","Entertainment"];
  const by = {};
  d.items.forEach(i => (by[i.cat] = by[i.cat] || []).push(i));
  el.innerHTML = `
    <p class="lede">Good news</p>
    <p class="sub">Success, growth and life — filtered from public feeds. Headlines link to the
      publisher; nothing is reproduced here. ${d.kept||d.items.length} of ${d.scanned||"?"} headlines got through.</p>
    <div class="row" style="margin-bottom:8px"><button class="mini" id="nRe">Refresh</button>
      <span class="gapnote">Cached for thirty minutes so the feeds are not hammered.</span></div>
    ${order.filter(c=>by[c]).map(c=>`
      <div class="ncat">${esc(c)}</div>
      <div class="card">${by[c].slice(0,14).map(i=>`
        <div class="nrow">
          <span class="nsrc">${esc(i.src)}</span>
          <a href="${esc(i.u)}" target="_blank" rel="noopener">${esc(i.t)}</a>
        </div>`).join("")}</div>`).join("")}`;
  $("#nRe").onclick = () => news(true);
}

/* boot */
load();
if(localStorage.getItem("ladder.tone")==="1"){
  window.addEventListener("pointerdown",()=>toneToggle(true),{once:true});
}
</script>
</body>
</html>

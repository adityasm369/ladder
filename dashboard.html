<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbfaf7; --ink:#14130f; --soft:#5d5a52; --faint:#96938a;
  --line:#e7e4dc; --card:#ffffff;
  --gold:#a67c1a; --gold-soft:#f6efdf;
  --green:#2f6d4a; --red:#a33a2b;
  --r:14px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#100f0d; --ink:#f2efe8; --soft:#a8a49a; --faint:#75726a;
  --line:#292722; --card:#16150f;
  --gold:#d6a63a; --gold-soft:#241d0c;
  --green:#5fae83; --red:#e0796a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:15px/1.65 Inter,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:Fraunces,Georgia,serif;font-weight:400;letter-spacing:-.01em}
a{color:inherit}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hin{max-width:1120px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:14px}
.brand{font-family:Fraunces,serif;font-size:20px;letter-spacing:.02em}
.brand b{font-weight:600}
.hsub{color:var(--faint);font-size:12.5px}
.spacer{flex:1}
.hbtn{border:1px solid var(--line);background:var(--card);color:var(--soft);
  border-radius:999px;padding:6px 13px;font:inherit;font-size:12.5px;cursor:pointer}
.hbtn:hover{border-color:var(--gold);color:var(--gold)}
nav.tabs{max-width:1120px;margin:0 auto;padding:0 22px;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{border:0;background:none;color:var(--soft);font:inherit;font-size:13.5px;
  padding:11px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
main{max-width:1120px;margin:0 auto;padding:26px 22px 90px}
.view{display:none} .view.on{display:block}
.lede{font-family:Fraunces,serif;font-size:clamp(23px,3.2vw,31px);line-height:1.28;
  max-width:24ch;margin:0 0 6px}
.sub{color:var(--soft);font-size:13.5px;margin:0 0 22px;max-width:62ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  font-weight:600;margin-bottom:7px}
.lbl .gapnote{text-transform:none;letter-spacing:0;font-size:12px}
input,textarea,select{width:100%;background:var(--paper);color:var(--ink);
  border:1px solid var(--line);border-radius:9px;padding:8px 11px;font:inherit;font-size:14px}
textarea{resize:vertical;line-height:1.6}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold)}
button.act{background:var(--ink);color:var(--paper);border:0;border-radius:9px;
  padding:9px 16px;font:inherit;font-weight:500;cursor:pointer}
button.act:hover{background:var(--gold)}
button.mini{background:none;border:1px solid var(--line);color:var(--soft);
  border-radius:8px;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer}
button.mini:hover{border-color:var(--gold);color:var(--gold)}
button.x{background:none;border:0;color:var(--faint);cursor:pointer;font-size:15px;padding:0 4px}
button.x:hover{color:var(--red)}

/* ---- the ladder ---- */
.rung{display:grid;grid-template-columns:56px 1fr;gap:16px;padding:16px 0;
  border-bottom:1px solid var(--line)}
.rung:last-child{border-bottom:0}
.rung .yr{font-family:Fraunces,serif;font-size:19px;color:var(--gold)}
.rung .yr small{display:block;font-family:Inter,sans-serif;font-size:10.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.rung h3{margin:0 0 3px;font-size:17px}
.rung .gap{color:var(--soft);font-size:13.5px;margin:2px 0 8px}
.rung .nxt{font-size:13.5px;background:var(--gold-soft);border-radius:8px;
  padding:7px 11px;display:inline-block}
.rung.done h3{text-decoration:line-through;color:var(--faint)}

/* ---- gaps ---- */
.gaprow{padding:13px 0;border-bottom:1px solid var(--line)}
.gaprow:last-child{border-bottom:0}
.gaphead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.gaphead b{font-size:15px}
.gapnum{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--soft);font-size:13px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--gold)}
/* ---- Top CTO ---- */
.ctonext{border-color:var(--gold);position:relative}
.ctotitle{font-size:26px;font-weight:600;letter-spacing:-.01em;margin-top:6px;line-height:1.2}
.ctodom{display:inline-block;margin-top:8px;font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);
  border-radius:999px;padding:2px 10px}
.ctothen{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--faint);display:flex;gap:18px;flex-wrap:wrap}
.ctothen i{font-style:normal;opacity:.6}
.ctogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;margin-top:14px}
.ctodomcard{margin:0}
.ctohead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ctopc{font-size:22px;font-weight:600;color:var(--gold);flex:0 0 auto}
.ctosec{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  margin:16px 0 8px}
.ctosec em{font-style:normal;color:var(--gold);letter-spacing:0;text-transform:none}
/* One capability. The description carries the reason it is on the list, which
   is the part that stops this becoming a wish list. */
.cap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;
  border-bottom:1px solid var(--line);font-size:14px}
.cap:last-of-type{border-bottom:0}
/* Every cell is placed explicitly. Auto-placement put the button in the first
   column and squeezed the text into a ribbon, because a row span without a
   column is still free to choose one. */
.cap b{grid-area:1/1;font-weight:600;min-width:0}
.cap span{grid-area:2/1;font-size:12.5px;color:var(--faint);line-height:1.5;min-width:0}
.cap button{grid-area:1/2/3/3;align-self:center;white-space:nowrap}
.cap.held b{color:var(--soft)}
.cap.held b::before{content:"✓ ";color:var(--gold)}
.cap.won b::before{content:"✓ "}
.cap.isnext{background:var(--line);margin:0 -13px;padding:9px 13px;border-radius:8px}
.cap.isnext b::before{content:"→ ";color:var(--gold)}
/* ---- the panel ---- */
.grid.top{align-items:start}
.insts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:16px}
.inst{border:1px solid var(--line);border-radius:12px;padding:13px 14px;background:var(--card)}
.iv{font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1.05}
.iv small{font-size:15px;font-weight:500;color:var(--faint)}
.il{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-top:5px}
.is{font-size:11.5px;color:var(--gold);margin-top:3px}
.prow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;margin-bottom:7px}
.prow input[type=checkbox]{width:auto;margin:0}
.prow .pin{border-color:transparent;background:none;padding-left:0;font-weight:500}
.prow input:checked ~ .pin{text-decoration:line-through;color:var(--faint)}
.pill{display:inline-block;margin-left:7px;font-size:10.5px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:999px;
  padding:1px 8px;vertical-align:middle}
.energy{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button.eb{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
  background:none;color:var(--soft);cursor:pointer;font:inherit}
button.eb.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.prow.six{grid-template-columns:auto auto 1fr}
.rank{font-size:12px;color:var(--faint);width:15px;text-align:right;font-variant-numeric:tabular-nums}
.prow.six input[type=checkbox]:checked ~ .rank{color:var(--gold)}
/* The statements are read, not scanned: bigger than a field, quieter than a
   heading, and numbered so there are two of them and not a list. */
.goalrow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;margin-bottom:10px}
.gn{font-size:20px;color:var(--faint);line-height:1.5;font-variant-numeric:tabular-nums}
.goalrow textarea{font-size:15.5px;line-height:1.55}
.rits{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.rit{border:1px solid var(--line);border-radius:11px;padding:12px 13px}
.rithead{font-size:13px;font-weight:600;margin-bottom:8px}
.rithead small{display:block;font-size:11.5px;font-weight:400;color:var(--faint);margin-top:2px}
.ritnote{margin-top:9px;font-size:12.5px;border-color:transparent;background:none;padding-left:0}
.gapnote{color:var(--faint);font-size:12.5px;margin-top:6px}

/* ---- practice ---- */
.streak{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.streak span{width:13px;height:13px;border-radius:3px;background:var(--line)}
.streak span.hit{background:var(--gold)}
.affirm{font-family:Fraunces,serif;font-size:clamp(19px,2.6vw,25px);line-height:1.45;
  margin:0;max-width:34ch}
.tick{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
.tick:last-child{border-bottom:0}
.tick input{width:auto}

/* ---- meditation ---- */
.timer{font-family:Fraunces,serif;font-size:64px;line-height:1;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.chakra{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ch{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;
  cursor:pointer;color:var(--soft)}
.ch.on{border-color:currentColor;font-weight:600}

/* ---- calendar ---- */
.evrow{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.evrow:last-child{border-bottom:0}
.evd{font-variant-numeric:tabular-nums;color:var(--gold);font-size:13px;min-width:92px}
.evk{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.soon{color:var(--red);font-weight:600}

/* ---- counsel ---- */
.lens{border-left:3px solid var(--gold);padding:2px 0 2px 15px;margin-bottom:18px}
.lens h4{margin:0 0 4px;font-family:Fraunces,serif;font-size:16px;font-weight:400}
.lens .src{color:var(--faint);font-size:11.5px;margin-bottom:6px}
.lens p{margin:0;color:var(--soft);font-size:14px}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.saved{color:var(--faint);font-size:12px}
@media(max-width:640px){ .rung{grid-template-columns:44px 1fr;gap:11px} }
/* ---- this week ---- */
.wk{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.wk:last-of-type{border-bottom:0}
.wk input{width:auto;margin-top:3px;flex:0 0 auto}
.wk b{font-weight:600}
.wkw{color:var(--soft);font-size:13px;line-height:1.55}
/* ---- wall ---- */
.cloud{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;
  font-family:Fraunces,serif;line-height:1.35;padding:6px 0}
.cloud span{color:var(--gold)}
.cloud span:nth-child(3n){color:var(--ink)}
.cloud span:nth-child(4n){color:var(--soft)}
.chipx{border:1px solid var(--line);border-radius:999px;padding:3px 6px 3px 11px;
  font-size:12.5px;color:var(--soft);display:inline-flex;align-items:center;gap:2px}
/* ---- the book ---- */
.sparks{margin-top:12px}
.spark{display:flex;gap:9px;align-items:center;padding:7px 0;font-size:14px;
  border-bottom:1px solid var(--line)}
.spark:last-child{border-bottom:0}
.spark span{flex:1;min-width:0}
.spark .mini{padding:2px 9px;font-size:11.5px}
button.star{background:none;border:0;cursor:pointer;font-size:15px;color:var(--faint);padding:0 2px}
button.star.on{color:var(--gold)}
.pieces{max-height:420px;overflow-y:auto}
.piece{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.piece:last-child{border-bottom:0}
.piece.on{background:var(--line);margin:0 -13px;padding:6px 13px;border-radius:8px}
.piece input[type=checkbox]{width:auto;margin:0;flex:0 0 auto}
button.pt{flex:1;min-width:0;text-align:left;background:none;border:0;cursor:pointer;
  color:var(--ink);font:inherit;padding:2px 0}
button.pt b{display:block;font-size:14px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
button.pt small{display:block;font-size:11.5px;color:var(--faint);margin-top:1px}
.piece .mini{padding:1px 7px;font-size:12px;line-height:1.5}
.piece .mini[disabled]{opacity:.3;cursor:default}
.wallgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:12px;margin-top:14px}
.wallit{margin:0;border:1px solid var(--line);border-radius:11px;overflow:hidden;
  background:var(--paper)}
.wallit img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}
.wallit figcaption{font-size:12.5px;color:var(--soft);padding:8px 10px;
  display:flex;gap:6px;align-items:center}
.wallit figcaption .x{margin-left:auto}
/* A PDF tile shows the document itself, in the browser's own viewer. Taller
   than the image tiles because a certificate is portrait and the point is to
   be able to read it. */
.wallit.ispdf{background:var(--card)}
.pdfbox{position:relative;width:100%;aspect-ratio:3/4;background:var(--line);overflow:hidden}
.pdfbox embed{width:100%;height:100%;display:block;border:0}
.pdfload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--faint)}
.wallit figcaption .pdfopen{margin-left:auto;padding:2px 9px;font-size:11.5px}
.wallit figcaption .pdfopen + .x{margin-left:4px}
/* ---- news ---- */
.ncat{margin:26px 0 10px;font-family:Fraunces,serif;font-size:19px}
.ncat:first-of-type{margin-top:6px}
.nrow{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
.nrow:last-child{border-bottom:0}
.nrow a{text-decoration:none;flex:1;line-height:1.5}
.nrow a:hover{color:var(--gold)}
.nsrc{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
  white-space:nowrap;min-width:104px}
</style>
</head>
<body>

<header>
  <div class="hin">
    <div>
      <div class="brand">The <b>Ladder</b></div>
      <div class="hsub" id="hsub">loading…</div>
    </div>
    <div class="spacer"></div>
    <span class="saved" id="saved"></span>
    <button class="hbtn" id="toneBtn" title="A steady 369 Hz tone, kept low">369 Hz</button>
    <button class="hbtn" id="themeBtn">Dark</button>
  </div>
  <nav class="tabs" id="tabs">
    <button data-v="today" class="on">Today</button>
    <button data-v="week">This week</button>
    <button data-v="cto">Top CTO</button>
    <button data-v="ladder">The Ladder</button>
    <button data-v="gaps">Golden gaps</button>
    <button data-v="practice">Practice</button>
    <button data-v="sit">Sit</button>
    <button data-v="calendar">Calendar</button>
    <button data-v="counsel">Counsel</button>
    <button data-v="news">Good news</button>
    <button data-v="book">The book</button>
    <button data-v="wall">Wall of fame</button>
  </nav>
</header>

<main>
  <div class="view on" id="v-today"></div>
  <div class="view" id="v-ladder"></div>
  <div class="view" id="v-gaps"></div>
  <div class="view" id="v-practice"></div>
  <div class="view" id="v-sit"></div>
  <div class="view" id="v-calendar"></div>
  <div class="view" id="v-week"></div>
  <div class="view" id="v-cto"></div>
  <div class="view" id="v-counsel"></div>
  <div class="view" id="v-news"></div>
  <div class="view" id="v-book"></div>
  <div class="view" id="v-wall"></div>
</main>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);

/* ---------------- state ----------------
   One document, held on the server behind the sign-in. Everything on this
   page is editable; nothing here is hard-coded content pretending to be
   yours. */
let S = null, dirty = false;

const SEED = {
  who:{name:"", role:"", since:""},
  horizon:"2031-03-31",
  vision:"",
  rungs:[], gaps:[], affirmations:[], practices:[], events:[],
  // Two statements, held here rather than per-day: the whole point of a
  // definite aim is that it does not change with the weather.
  goals:["", ""],
  log:{},          // "YYYY-MM-DD": {intention, six, grat, ritual, review, done}
};

async function load(){
  try{
    const d = await fetch("/api/state").then(r=>r.ok?r.json():{});
    S = Object.assign(structuredClone(SEED), d||{});
  }catch(e){ S = structuredClone(SEED); }
  if(!S.rungs.length) firstRun();
  paint();
}
let saveTimer=null;
function save(){
  dirty=true; $("#saved").textContent="…";
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{
      await fetch("/api/state",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify(S)});
      dirty=false;
      $("#saved").textContent="saved";
      setTimeout(()=>{ if(!dirty) $("#saved").textContent=""; }, 1800);
    }catch(e){ $("#saved").textContent="not saved"; }
  }, 700);
}

/* A starting shape, not a prescription: every line is editable and several
   are deliberately blank, because a ladder someone else wrote is not yours. */
function firstRun(){
  const y=new Date().getFullYear();
  S.who={name:"Aditya Sriram Mattaparthi", role:"Software Principal Engineer, Dell Technologies", since:String(y)};
  S.vision="";
  S.rungs=[
    {y:String(y),   t:"Where I stand", gap:"", nxt:"", done:false},
    {y:String(y+1), t:"", gap:"", nxt:"", done:false},
    {y:String(y+2), t:"", gap:"", nxt:"", done:false},
    {y:String(y+3), t:"", gap:"", nxt:"", done:false},
    {y:String(y+5), t:"The horizon", gap:"", nxt:"", done:false},
  ];
  S.gaps=[
    {n:"", have:0, want:0, unit:"", note:""},
  ];
  S.affirmations=[];
  S.practices=[
    {id:"p1", t:"Sit — 20 minutes"},
    {id:"p2", t:"Read one page and act on one line"},
    {id:"p3", t:"One conversation that moves a rung"},
  ];
  S.events=[];
  save();
}

/* ---------------- tabs ---------------- */
$("#tabs").addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  $$("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
  $$(".view").forEach(v=>v.classList.remove("on"));
  $("#v-"+b.dataset.v).classList.add("on");
  window.scrollTo({top:0});
});

/* ---------------- theme + tone ---------------- */
$("#themeBtn").onclick=()=>{
  const dark=document.documentElement.dataset.theme==="dark";
  document.documentElement.dataset.theme=dark?"light":"dark";
  $("#themeBtn").textContent=dark?"Dark":"Light";
  localStorage.setItem("ladder.theme",document.documentElement.dataset.theme);
};
if(localStorage.getItem("ladder.theme")==="dark"){
  document.documentElement.dataset.theme="dark"; }

let TONE=null, TONE_ON=false;
function toneToggle(on){
  try{
    if(on){
      if(!TONE){
        const ctx=new (window.AudioContext||window.webkitAudioContext)();
        const o=ctx.createOscillator(), g=ctx.createGain();
        o.type="sine"; o.frequency.value=369; g.gain.value=0;
        o.connect(g).connect(ctx.destination); o.start();
        g.gain.linearRampToValueAtTime(0.012, ctx.currentTime+2.5);
        TONE={ctx,o,g};
      } else { TONE.ctx.resume();
        TONE.g.gain.linearRampToValueAtTime(0.012, TONE.ctx.currentTime+1.5); }
      TONE_ON=true;
    } else if(TONE){
      TONE.g.gain.linearRampToValueAtTime(0, TONE.ctx.currentTime+0.6); TONE_ON=false;
    }
    localStorage.setItem("ladder.tone", TONE_ON?"1":"0");
  }catch(e){}
  $("#toneBtn").textContent = TONE_ON ? "369 Hz ⏸" : "369 Hz";
}
$("#toneBtn").onclick=()=>toneToggle(!TONE_ON);

/* ---------------- painting ---------------- */
function paint(){ hdr(); today_(); week(); cto(); news(); ladder(); gaps(); practice(); sit(); calendar_(); counsel(); wall(); book(); }

function hdr(){
  const d=new Date(S.horizon||"");
  const days=isNaN(d)?null:Math.ceil((d-new Date())/864e5);
  $("#hsub").textContent = (S.who.role||"") + (days!=null?` · ${days.toLocaleString()} days to the horizon`:"");
}

/* ---- Today ---- */
/* The control panel.

   It answers, in this order: how am I doing, what am I steering by, what am I
   doing today, and what actually happened. The instruments across the top are
   read-only and come from the other pages -- nothing is typed twice, and a
   number that has no page behind it is not on here.

   More is captured than before (three priorities, what you are declining,
   energy, a win as it happens) because the things that decide a career are
   small and get lost by evening. Everything still fits one screen. */

function dayKey(d){ return d.toISOString().slice(0,10); }

/* Consecutive days with at least one practice ticked. Today not yet started
   does not break it -- a streak that dies at 00:01 measures the clock. */
function streakLen(){
  let n = 0;
  for(let i = 0; i < 400; i++){
    const d = new Date(); d.setDate(d.getDate() - i);
    const done = ((S.log[dayKey(d)] || {}).done || []).length;
    if(done) n++;
    else if(i > 0) break;
  }
  return n;
}

function ctoProgress(){
  const st = ctoState();
  let held = 0, total = 0;
  for(const d of Object.keys(CTO)){
    const gaps = [...CTO[d].gaps, ...((st.extra[d] || []).map(x => [x.t]))];
    held += CTO[d].held.length + gaps.filter(([t]) => st.done[ctoKey(d, t)]).length;
    total += CTO[d].held.length + gaps.length;
  }
  return {pc: total ? Math.round(held / total * 100) : 0, held, total};
}

function nextEvent(){
  const t = today();
  return [...(S.events || [])].filter(e => String(e.d) >= t)
    .sort((a, b) => String(a.d).localeCompare(String(b.d)))[0] || null;
}

function inst(v, l, sub){
  return `<div class="inst"><div class="iv">${v}</div><div class="il">${esc(l)}</div>
    ${sub ? `<div class="is">${esc(sub)}</div>` : ""}</div>`;
}

/* ---- the day's method ----

   Ivy Lee, as he actually described it in 1918: at the end of the day write
   down the six things that matter tomorrow, in order of importance; start at
   one and do not touch two until one is finished; carry whatever is left to
   the top of tomorrow's list. Six, not ten, and ordered, not tagged -- the
   constraint is the method. The three rituals are the scaffolding around it:
   the list is READ in the morning, CHECKED at noon, and WRITTEN in the
   evening for the day after.
*/
const RITUALS = [
  {k:"am", label:"Morning", when:"before the day claims you", items:[
    ["r1", "Read both statements aloud"],
    ["r2", "Write the gratitude"],
    ["r3", "Open number one — nothing else"],
  ]},
  {k:"noon", label:"Noon", when:"the checkpoint, not a second start", items:[
    ["r4", "Is number one actually finished?"],
    ["r5", "No new work above the list"],
    ["r6", "Stand up, breathe, eat properly"],
  ]},
  {k:"pm", label:"Evening", when:"close it, then write tomorrow", items:[
    ["r7", "Say what moved and what did not"],
    ["r8", "Write tomorrow's six, in order"],
    ["r9", "Read both statements again"],
  ]},
];

/* Six slots, always. An older day may hold the three-priority list this page
   used to keep; those become the first three rather than being lost. */
function sixOf(e){
  let six = e.six;
  if(!six){
    six = (e.prio || []).map(p => ({t:p.t || "", done:!!p.done}));
  }
  six = six.slice(0, 6);
  while(six.length < 6) six.push({t:"", done:false});
  return six;
}

function carryForward(){
  const l = log(), six = sixOf(l).filter(x => x.t.trim() && !x.done);
  const d = new Date(); d.setDate(d.getDate() + 1);
  const k2 = d.toISOString().slice(0, 10);
  S.log[k2] = S.log[k2] || {};
  const tomorrow = sixOf(S.log[k2]).filter(x => x.t.trim());
  const merged = [...six.map(x => ({t:x.t, done:false})), ...tomorrow]
    .filter((x, i, a) => a.findIndex(y => y.t === x.t) === i).slice(0, 6);
  while(merged.length < 6) merged.push({t:"", done:false});
  S.log[k2].six = merged;
  save(); today_();
  const n = six.length;
  $("#carryMsg").textContent = n
    ? `${n} carried to the top of tomorrow's list`
    : "nothing left over — the list was finished";
}

function today_(){
  const k = today(), e = S.log[k] || {};
  const six = sixOf(e);
  e.ritual = e.ritual || {};
  S.goals = S.goals || ["", ""];
  const aff = S.affirmations.length
    ? S.affirmations[new Date().getDate() % S.affirmations.length] : "";
  const open = S.rungs.find(r => !r.done && r.nxt);
  const hz = new Date(S.horizon || "");
  const days = isNaN(hz) ? null : Math.ceil((hz - new Date()) / 864e5);
  const doneToday = (e.done || []).length, allP = (S.practices || []).length;
  const cp = ctoProgress(), nx = ctoOpen()[0], ev = nextEvent();
  const wins = (S.wins || []).length;
  const gap = (S.gaps || []).filter(g => +g.want > 0)
    .map(g => ({n: g.n, pc: Math.min(100, (+g.have / +g.want) * 100)}))
    .sort((a, b) => b.pc - a.pc)[0];
  const sixDone = six.filter(x => x.t.trim() && x.done).length;
  const sixSet  = six.filter(x => x.t.trim()).length;
  const ritDone = RITUALS.reduce((n, r) => n + ((e.ritual[r.k] || {}).done || []).length, 0);
  const ritAll  = RITUALS.reduce((n, r) => n + r.items.length, 0);

  $("#v-today").innerHTML = `
  <p class="lede">${esc(new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"}))}</p>
  <p class="sub">The panel. What the instruments say, what you are steering by, and what
    you did with the day — decided in the morning, answered at night.</p>

  <div class="insts">
    ${inst(days != null ? days.toLocaleString() : "—", "days to the horizon",
           S.horizon ? new Date(S.horizon).getFullYear() : "")}
    ${inst(`${sixDone}<small>/${sixSet||6}</small>`, "the six", sixSet ? "in order" : "not written yet")}
    ${inst(`${ritDone}<small>/${ritAll}</small>`, "rituals kept", ritDone === ritAll ? "all three" : "")}
    ${inst(streakLen(), "day practice streak", "unbroken")}
    ${inst(cp.pc + "<small>%</small>", "CTO ground held", `${cp.held} of ${cp.total}`)}
    ${inst(wins, "wins on the wall", wins ? "keep adding" : "start one")}
  </div>

  <div class="grid g2 top" style="margin-top:14px">
    <div class="card">
      <div class="lbl">Steering — decided before the day starts</div>
      <textarea id="tIntent" rows="2" placeholder="The one thing that would make today count.">${esc(e.intention||"")}</textarea>

      <div class="lbl" style="margin-top:16px">The six, in order
        <span class="gapnote" style="margin:0">— Ivy Lee: number two waits until number one is done</span></div>
      ${six.map((p, i) => `<label class="prow six">
        <span class="rank">${i+1}</span>
        <input type="checkbox" data-pi="${i}" ${p.done?"checked":""}>
        <input class="pin" data-pt="${i}" value="${esc(p.t)}"
          placeholder="${i===0?"The one that cannot slip":i===1?"Only after one is finished":"…"}">
      </label>`).join("")}
      <div class="row" style="margin-top:10px">
        <button class="mini" onclick="carryForward()">Carry the unfinished to tomorrow</button>
        <span class="gapnote" id="carryMsg" style="margin:0"></span>
      </div>

      <div class="lbl" style="margin-top:16px">Saying no to
        <span class="gapnote" style="margin:0">— an unconsidered yes is a no to the ladder</span></div>
      <input id="tNo" value="${esc(e.no||"")}" placeholder="What you are declining today">
    </div>

    <div class="card">
      <div class="lbl">Today's line</div>
      ${aff ? `<p class="affirm">${esc(aff)}</p>`
            : `<p class="sub" style="margin:0">Add your affirmations under Practice and one appears here each day.</p>`}

      ${nx ? `<div class="lbl" style="margin-top:18px">Next to conquer</div>
        <p style="margin:0"><b>${esc(nx.t)}</b>
        <span class="pill">${esc(CTO[nx.d].label)}</span></p>` : ""}

      ${open ? `<div class="lbl" style="margin-top:18px">Next on the ladder</div>
        <p style="margin:0"><b>${esc(open.t||open.y)}</b><br>
        <span class="sub" style="margin:0">${esc(open.nxt)}</span></p>` : ""}

      ${gap ? `<div class="lbl" style="margin-top:18px">Closest golden gap</div>
        <p style="margin:0 0 4px"><b>${esc(gap.n||"—")}</b></p>
        <div class="bar"><i style="width:${gap.pc.toFixed(1)}%"></i></div>` : ""}

      ${ev ? `<div class="lbl" style="margin-top:18px">Coming up</div>
        <p style="margin:0"><b>${esc(ev.t)}</b>
        <span class="sub" style="margin:0"> — ${esc(ev.k)},
        ${Math.max(0, Math.ceil((new Date(ev.d)-new Date(today()))/864e5))} days</span></p>` : ""}
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="lbl">The two statements
      <span class="gapnote" style="margin:0">— present tense, dated, and specific enough to be wrong</span></div>
    <p class="sub" style="margin:-2px 0 12px">Written once and read aloud twice a day, morning and night.
      Not a wish: a position, a date, and what it costs. These do not change with the weather —
      edit them when the aim changes, not when the day is hard.</p>
    ${[0,1].map(i => `<div class="goalrow">
      <span class="gn">${i+1}</span>
      <textarea data-goal="${i}" rows="2" placeholder="${i===0
        ? "By March 2031 I am … , and to earn it I …"
        : "The second aim, in the same shape"}">${esc((S.goals||[])[i]||"")}</textarea>
    </div>`).join("")}
  </div>

  <div class="card" style="margin-top:14px">
    <div class="lbl">The three rituals</div>
    <p class="sub" style="margin:-2px 0 14px">The scaffolding around the six: the list is read in the
      morning, checked at noon, and written in the evening for the day after.</p>
    <div class="rits">
      ${RITUALS.map(r => {
        const st = e.ritual[r.k] || {};
        const dn = st.done || [];
        return `<div class="rit">
          <div class="rithead">${esc(r.label)}<small>${esc(r.when)}</small></div>
          ${r.items.map(([id, t]) => `<label class="tick">
            <input type="checkbox" data-rit="${esc(r.k)}" data-rid="${esc(id)}" ${dn.includes(id)?"checked":""}>
            <span>${esc(t)}</span></label>`).join("")}
          <input class="ritnote" data-ritn="${esc(r.k)}" value="${esc(st.note||"")}"
            placeholder="A line, if there is one">
        </div>`;
      }).join("")}
    </div>
  </div>

  <div class="card" style="margin-top:14px">
    <div class="lbl">Practice</div>
    ${(S.practices||[]).map(p => `<label class="tick">
      <input type="checkbox" data-p="${esc(p.id)}" ${(e.done||[]).includes(p.id)?"checked":""}>
      <span>${esc(p.t)}</span></label>`).join("")
      || `<p class="sub" style="margin:0">No practices yet — add them under Practice.</p>`}
    <div class="streak" id="streak"></div>
    <div class="gapnote">Last thirty days. A gap is information, not a verdict.</div>
  </div>

  <div class="grid g3 top" style="margin-top:14px">
    <div class="card">
      <div class="lbl">Gratitude</div>
      <p class="sub" style="margin:-2px 0 10px">Three, and specific. "My family" is a category;
        the ten minutes someone gave you this morning is a thing that happened.</p>
      <textarea id="tGrat" rows="5" placeholder="Today I am grateful for…">${esc(e.grat||"")}</textarea>
    </div>
    <div class="card">
      <div class="lbl">Tonight</div>
      <textarea id="tReview" rows="4" placeholder="What actually moved. What did not, and why.">${esc(e.review||"")}</textarea>
      <div class="lbl" style="margin-top:14px">Energy</div>
      <div class="energy">${[1,2,3,4,5].map(n =>
        `<button class="eb${+e.energy===n?" on":""}" data-en="${n}">${n}</button>`).join("")}</div>
      <div class="gapnote">1 spent · 5 charged. Worth knowing which days give it back.</div>
    </div>
    <div class="card">
      <div class="lbl">A win, while you remember it</div>
      <p class="sub" style="margin:-2px 0 10px">Goes straight to the wall — the only honest argument
        that you do hard things.</p>
      <div class="row">
        <input id="tWinT" placeholder="In two or three words" style="flex:1;min-width:120px">
        <input id="tWinW" type="number" min="1" max="10" value="5" title="How much it mattered" style="max-width:80px">
        <button class="act" id="tWinAdd">Add</button>
      </div>
      ${wins ? `<div class="row" style="margin-top:12px">${(S.wins||[]).slice(-4).reverse()
        .map(w => `<span class="chipx" style="padding-right:11px">${esc(w.t)}</span>`).join("")}</div>` : ""}
    </div>
  </div>`;

  $("#tIntent").oninput = ev2 => { log().intention = ev2.target.value; save(); };
  $("#tReview").oninput = ev2 => { log().review = ev2.target.value; save(); };
  $("#tNo").oninput     = ev2 => { log().no = ev2.target.value; save(); };
  $("#tGrat").oninput   = ev2 => { log().grat = ev2.target.value; save(); };

  $$("#v-today [data-goal]").forEach(t => t.oninput = () => {
    S.goals = S.goals || ["", ""];
    S.goals[+t.dataset.goal] = t.value; save(); });

  // The six live under their own key; writing them back through sixOf keeps a
  // day that predates this page from losing its three.
  const setSix = (i, f, v) => { const l = log(); l.six = sixOf(l); l.six[i][f] = v; save(); };
  $$("#v-today [data-pt]").forEach(inp => inp.oninput = () => setSix(+inp.dataset.pt, "t", inp.value));
  $$("#v-today [data-pi]").forEach(cb => cb.onchange = () => { setSix(+cb.dataset.pi, "done", cb.checked); today_(); });

  const rit = k2 => { const l = log(); l.ritual = l.ritual || {};
                      l.ritual[k2] = l.ritual[k2] || {done:[], note:""};
                      l.ritual[k2].done = l.ritual[k2].done || []; return l.ritual[k2]; };
  $$("#v-today [data-rit]").forEach(cb => cb.onchange = () => {
    const r = rit(cb.dataset.rit), id = cb.dataset.rid;
    if(cb.checked){ if(!r.done.includes(id)) r.done.push(id); }
    else r.done = r.done.filter(x => x !== id);
    save(); today_();
  });
  $$("#v-today [data-ritn]").forEach(inp => inp.oninput = () => {
    rit(inp.dataset.ritn).note = inp.value; save(); });

  $$("#v-today [data-en]").forEach(b => b.onclick = () => {
    const l = log();
    l.energy = (+l.energy === +b.dataset.en) ? 0 : +b.dataset.en;   // click again to clear
    save(); today_();
  });

  $$("#v-today input[data-p]").forEach(cb => cb.onchange = () => {
    const l = log(); l.done = l.done || [];
    const id = cb.dataset.p;
    if(cb.checked){ if(!l.done.includes(id)) l.done.push(id); }
    else l.done = l.done.filter(x => x !== id);
    save(); today_();
  });

  $("#tWinAdd").onclick = () => {
    const t = $("#tWinT").value.trim();
    if(!t) return;
    S.wins = [...(S.wins||[]), {t, w:+$("#tWinW").value||5, n:"", on:today()}];
    save(); today_(); wall();
  };

  streak();
}
function log(){ const k=today(); S.log[k]=S.log[k]||{}; return S.log[k]; }
function streak(){
  const el=$("#streak"); if(!el) return;
  let h="";
  for(let i=29;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const k=d.toISOString().slice(0,10);
    const done=((S.log[k]||{}).done||[]).length;
    h+=`<span class="${done?"hit":""}" title="${k}"></span>`;
  }
  el.innerHTML=h;
}

  <div class="card">

      <input id="lHorizon" type="date" value="${esc(S.horizon||"")}" style="max-width:190px">

    </div>
  </div>
  <div class="card" style="margin-top:14px">
    ${S.rungs.map((r,i)=>`<div class="rung ${r.done?"done":""}">
      <div class="yr">${esc(r.y||"")}<small>${r.done?"done":"open"}</small></div>
      <div>
        <div class="row" style="gap:6px">
          <input data-i="${i}" data-f="t" value="${esc(r.t)}" placeholder="The position you hold at this rung"

        <input data-i="${i}" data-f="nxt" value="${esc(r.nxt)}" placeholder="The next action that closes some of it"
          style="border-color:transparent;background:none;padding-left:0;font-size:13.5px">
        <div class="row" style="margin-top:6px">

  $("#lHorizon").onchange=e=>{ S.horizon=e.target.value; save(); hdr(); };

}

/* ---- Golden gaps ---- */
function gaps(){
  $("#v-gaps").innerHTML=`
  <p class="lede">The distance, stated honestly</p>
  <p class="sub">A gap you can measure is a gap you can close. Put the real number in
    <em>have</em> — the value of this page is that it does not flatter you.</p>
  <div class="card">
    ${S.gaps.map((g,i)=>{
      const pc = (+g.want>0) ? Math.max(0,Math.min(100, (+g.have/ +g.want)*100)) : 0;
      const mult = (+g.have>0 && +g.want>0) ? (+g.want / +g.have) : null;
      return `<div class="gaprow">
        <div class="gaphead">
          <input data-i="${i}" data-f="n" value="${esc(g.n)}" placeholder="What you are measuring"
            style="border-color:transparent;background:none;padding-left:0;font-weight:600;max-width:340px">
          <span class="gapnum">${mult?`${mult>=1000?Math.round(mult).toLocaleString():mult.toFixed(1)}× to go`:""}</span>
          <button class="x" data-del="${i}">×</button>
        </div>
        <div class="row" style="gap:8px;margin-top:4px">
          <input data-i="${i}" data-f="have" value="${esc(g.have)}" placeholder="have" style="max-width:130px">
          <span class="gapnote">of</span>
          <input data-i="${i}" data-f="want" value="${esc(g.want)}" placeholder="want" style="max-width:150px">
          <input data-i="${i}" data-f="unit" value="${esc(g.unit)}" placeholder="unit" style="max-width:110px">
        </div>
        <div class="bar"><i style="width:${pc.toFixed(2)}%"></i></div>
        <input data-i="${i}" data-f="note" value="${esc(g.note)}" placeholder="What would actually move this number"
          style="border-color:transparent;background:none;padding-left:0;font-size:12.5px;color:var(--faint);margin-top:6px">
      </div>`;}).join("")}
    <div class="row" style="margin-top:14px"><button class="mini" id="gAdd">+ Add a gap</button></div>
  </div>`;
  $$("#v-gaps input[data-f]").forEach(i=>i.oninput=()=>{
    S.gaps[+i.dataset.i][i.dataset.f]=i.value; save();
    if(["have","want"].includes(i.dataset.f)) gaps(); });
  $$("#v-gaps [data-del]").forEach(b=>b.onclick=()=>{ S.gaps.splice(+b.dataset.del,1); save(); gaps(); });
  $("#gAdd").onclick=()=>{ S.gaps.push({n:"",have:0,want:0,unit:"",note:""}); save(); gaps(); };
}

/* ============ THIS WEEK + THE WALL ============

   a week having actually done five things.

   The pools are written here rather than fetched live: a queue that changes
   under you is not a commitment.

   Technical skill is NOT one of these queues. It used to be, and it was the
   wrong shape for it: a rotating five turns a career into a to-do list, and

function poolState(k){
  S.pools = S.pools || {};
  const P = POOLS[k];
  if(!S.pools[k]){
    S.pools[k] = {shown: P.items.slice(0, P.n).map(x=>x[0]), done: [], queued: []};
  }
  return S.pools[k];
}

/* Anything queued yesterday or earlier is due this morning. */
function ripen(){
  let changed = false;
  for(const k of Object.keys(POOLS)){
    const st = poolState(k);
    const due = st.queued.filter(q => q.at <= today());
    if(due.length){
      st.queued = st.queued.filter(q => q.at > today());
      due.forEach(q => { if(!st.shown.includes(q.t)) st.shown.push(q.t); });
      changed = true;
    }
  }
  if(changed) save();
}

function tickPool(k, title){
  const P = POOLS[k], st = poolState(k);
  st.shown = st.shown.filter(t => t !== title);
  st.done.push({t: title, on: today()});
  // The replacement is the first pool item neither shown, done, nor queued.
  const taken = new Set([...st.shown, ...st.done.map(d=>d.t), ...st.queued.map(q=>q.t)]);
  const next = P.items.map(x=>x[0]).find(t => !taken.has(t));
  if(next){
    const d = new Date(); d.setDate(d.getDate()+1);
    st.queued.push({t: next, at: d.toISOString().slice(0,10)});
  }
  save(); week();
}

function week(){
  ripen();
  const blocks = Object.keys(POOLS).map(k => {
    const P = POOLS[k], st = poolState(k);
    const byTitle = Object.fromEntries(P.items);
    const rows = st.shown.map(t => `
      <label class="wk">
        <input type="checkbox" data-k="${esc(k)}" data-t="${esc(t)}">
        <span><b>${esc(t)}</b><br><span class="wkw">${esc(byTitle[t]||"")}</span></span>
      </label>`).join("") ||
      `<p class="sub" style="margin:0">Nothing waiting — the pool is empty. Add your own below.</p>`;
    const soon = st.queued.length
      ? `<div class="gapnote">${st.queued.length} arriving tomorrow morning</div>` : "";
    const done = st.done.length
      ? `<div class="gapnote">${st.done.length} done so far</div>` : "";
    return `<div class="card" style="margin-bottom:14px">
      <div class="lbl">${esc(P.title)}</div>
      <p class="sub" style="margin:-2px 0 12px">${esc(P.note)}</p>
      ${rows}${soon}${done}
    </div>`;
  }).join("");

  $("#v-week").innerHTML = `
    <p class="lede">This week</p>
    <p class="sub">Tick something and its replacement arrives tomorrow morning, not this second.
      The point is to finish a week having done five things, not to keep a list moving.</p>
    ${blocks}`;

  $$("#v-week input[data-k]").forEach(cb => cb.onchange = () => {
    if(cb.checked) tickPool(cb.dataset.k, cb.dataset.t);
  });
}

/* ============ TOP CTO ============

   thing is named, because a list of twelve gaps is a way of not choosing.
   The order is deliberate and explainable in a sentence: closeness to ground
   already held first (that is what makes it conquerable in weeks rather than
   years), then how short the market is of it. It is not recency and it is

function ctoState(){
  S.cto = S.cto || {done:{}, extra:{}};
  S.cto.done = S.cto.done || {};
  S.cto.extra = S.cto.extra || {};
  return S.cto;
}
const ctoKey = (d, t) => d + "::" + t;

/* Every open gap across the four domains, hardest-priority first. */
function ctoOpen(){
  const st = ctoState(), out = [];
  for(const d of Object.keys(CTO)){
    const all = [...CTO[d].gaps, ...(st.extra[d]||[]).map(x => [x.t, x.w||"", +x.p||50])];
    for(const [t, why, p] of all)
      if(!st.done[ctoKey(d,t)]) out.push({d, t, why, p});
  }
  return out.sort((a,b) => b.p - a.p || a.t.localeCompare(b.t));
}

function ctoConquer(d, t){
  ctoState().done[ctoKey(d,t)] = today();
  save(); cto();
}
function ctoUndo(d, t){
  delete ctoState().done[ctoKey(d,t)];
  save(); cto();
}

function cto(){
  const st = ctoState(), open = ctoOpen(), next = open[0], then = open.slice(1,3);

  const hero = next ? `
    <div class="card ctonext">
      <div class="lbl">Next to conquer</div>
      <div class="ctotitle">${esc(next.t)}</div>
      <div class="ctodom">${esc(CTO[next.d].label)}</div>
      <p class="sub" style="margin:10px 0 0">${esc(next.why)}</p>
      <div class="row" style="margin-top:16px;align-items:center">
        <button class="act" onclick="ctoConquer('${esc(next.d)}','${esc(next.t)}')">Conquered — what is next</button>
        <span class="gapnote">${open.length} open across four domains</span>
      </div>
      ${then.length ? `<div class="ctothen">Then: ${then.map(x =>
        `<span>${esc(x.t)} <i>${esc(CTO[x.d].label)}</i></span>`).join("")}</div>` : ""}
    </div>`
    : `<div class="card ctonext">
        <div class="lbl">Next to conquer</div>
        <div class="ctotitle">Nothing open.</div>
        <p class="sub" style="margin:10px 0 0">Four domains closed. Write the next four —
          the map is meant to outgrow itself.</p>
      </div>`;

  const doms = Object.keys(CTO).map(d => {
    const D = CTO[d];
    const extra = st.extra[d] || [];
    const gaps = [...D.gaps, ...extra.map(x => [x.t, x.w||"", +x.p||50])];
    const won  = gaps.filter(([t]) => st.done[ctoKey(d,t)]);
    const openG = gaps.filter(([t]) => !st.done[ctoKey(d,t)])
                      .sort((a,b) => b[2]-a[2]);
    const total = D.held.length + gaps.length;
    const pc = total ? ((D.held.length + won.length) / total) * 100 : 0;

    return `<div class="card ctodomcard">
      <div class="ctohead">
        <div><div class="lbl">${esc(D.label)}</div>
          <p class="sub" style="margin:2px 0 0">${esc(D.note)}</p></div>
        <div class="ctopc">${Math.round(pc)}%</div>
      </div>
      <div class="bar"><i style="width:${pc.toFixed(1)}%"></i></div>

      <div class="ctosec">Held</div>
      ${D.held.map(([t, w]) => `<div class="cap held">
        <b>${esc(t)}</b><span>${esc(w)}</span></div>`).join("")}
      ${won.map(([t, w]) => `<div class="cap held won">
        <b>${esc(t)}</b><span>${esc(w)} <i>— conquered ${esc(st.done[ctoKey(d,t)])}</i></span>
        <button class="mini" onclick="ctoUndo('${esc(d)}','${esc(t)}')">undo</button></div>`).join("")}

      <div class="ctosec">Open${next && next.d === d ? ` <em>— next is here</em>` : ""}</div>
      ${openG.length ? openG.map(([t, w]) => `<div class="cap${next && next.t === t && next.d === d ? " isnext" : ""}">
        <b>${esc(t)}</b><span>${esc(w)}</span>
        <button class="mini" onclick="ctoConquer('${esc(d)}','${esc(t)}')">done</button></div>`).join("")
        : `<p class="sub" style="margin:0">Closed. Add what you find next.</p>`}

      <div class="row" style="margin-top:12px">
        <input data-add="${esc(d)}" placeholder="Another gap in ${esc(D.label)}" style="flex:1;min-width:170px">
        <button class="mini" data-addb="${esc(d)}">+ Add</button>
      </div>
    </div>`;
  }).join("");

  $("#v-cto").innerHTML = `
    <p class="lede">Top CTO</p>
    <p class="sub">Where you stand in the four domains a CTO is actually asked about, and the

    ${hero}

/* ============ THE BOOK ============

   A storehouse first and a manuscript second. Ideas get thrown in without
   ceremony, titles compete until one is chosen, and pieces -- memories,
   anecdotes, essays -- are written whenever they arrive. Only when you say so
   are they assembled, in an order you set, into a document.

   Both exporters are written here by hand. This project carries no third-party
   code and fetches nothing from a CDN, and a manuscript is exactly the kind of
   thing you want to be able to produce on a laptop with no network:

     .docx is a ZIP of XML, so there is a small store-only ZIP writer below.
     .pdf is assembled object by object with the standard Helvetica faces.

   Neither is typeset -- they are clean manuscripts, which is what an editor
   or a self-publishing tool wants anyway.
*/

const KINDS = ["Memory", "Anecdote", "Essay", "Chapter", "Note"];

function bookState(){
  S.book = S.book || {};
  const b = S.book;
  b.title = b.title || ""; b.subtitle = b.subtitle || ""; b.author = b.author || "";
  b.ideas = b.ideas || []; b.titles = b.titles || []; b.pieces = b.pieces || [];
  return b;
}
const words = t => (String(t || "").trim().match(/\S+/g) || []).length;

function bookStats(){
  const b = bookState();
  const used = b.pieces.filter(p => p.use !== false);
  const w = used.reduce((n, p) => n + words(p.body), 0);
  return {w, pieces: used.length, all: b.pieces.length,
          pages: Math.max(1, Math.round(w / 280))};      // 280 words a printed page
}

let BOOKSEL = null;

function book(){

      server until you download it.</p>

    <div class="insts">

      ${inst(b.ideas.length, "ideas waiting", "")}

/* Redrawing the whole view on every keystroke would take the caret with it,
   so the list and the counters are updated in place while the editor is
   being typed into. */
function paintPieceList(){
  const b = bookState(), st = bookStats();
  b.pieces.forEach(p => {
    const btn = document.querySelector(`#v-book [data-open="${p.id}"]`);
    if(btn) btn.innerHTML = `<b>${esc(p.t || "Untitled")}</b><small>${esc(p.kind || "Note")} · ${words(p.body)} words</small>`;
  });

  if(m) m.textContent = `${st.w.toLocaleString()} words · about ${st.pages} page${st.pages===1?'':'s'}`;

/* ---- assembling ---- */

function bookDoc(){
  const b = bookState();
  return {
    title: b.title || (b.titles.find(t => t.fav) || {}).t || "Untitled",
    subtitle: b.subtitle || "",
    author: b.author || (S.who || {}).name || "",
    pieces: b.pieces.filter(p => p.use !== false)
      .map(p => ({t: p.t || "Untitled", kind: p.kind || "", body: p.body || ""})),
  };
}

function download(blob, name){
  const u = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
}
const slug = s => (s || "book").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "book";

function exportBook(kind){
  const d = bookDoc();
  if(!d.pieces.length){ $("#bkMsg").textContent = "nothing ticked to put in it yet"; return; }
  try{
    if(kind === "docx") download(docxBlob(d), slug(d.title) + ".docx");
    else download(pdfBlob(d), slug(d.title) + ".pdf");
    $("#bkMsg").textContent = `${kind} written · ${bookStats().w.toLocaleString()} words`;
  }catch(e){
    $("#bkMsg").textContent = "could not build it: " + e.message;
  }
}

/* ---- .docx : a ZIP of XML ---- */

const CRCTAB = (() => {
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){
    let c = n;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < u8.length; i++) c = CRCTAB[(c ^ u8[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

/* Store only, no deflate. A manuscript is a few hundred kilobytes of text and
   Word does not care; writing a compressor here would be the tail wagging. */
function zipBlob(files, mime){
  const enc = new TextEncoder(), parts = [], central = [];
  const u16 = n => [n & 255, (n >>> 8) & 255];
  const u32 = n => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];
  let off = 0;
  for(const f of files){
    const nm = enc.encode(f.name), data = enc.encode(f.body), c = crc32(data);
    const head = new Uint8Array([...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(0),
      ...u16(0), ...u16(0), ...u32(c), ...u32(data.length), ...u32(data.length),
      ...u16(nm.length), ...u16(0)]);
    parts.push(head, nm, data);
    central.push({nm, c, len: data.length, off});
    off += head.length + nm.length + data.length;
  }
  const cd = [];
  let cdLen = 0;
  for(const e of central){
    const h = new Uint8Array([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0), ...u16(0),
      ...u16(0), ...u16(0), ...u32(e.c), ...u32(e.len), ...u32(e.len), ...u16(e.nm.length),
      ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(e.off)]);
    cd.push(h, e.nm);
    cdLen += h.length + e.nm.length;
  }
  const end = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0),
    ...u16(central.length), ...u16(central.length), ...u32(cdLen), ...u32(off), ...u16(0)]);
  return new Blob([...parts, ...cd, end], {type: mime});
}

const xe = s => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
  .replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function docxBlob(d){
  const P = (text, o = {}) =>
    `<w:p><w:pPr>${o.center ? '<w:jc w:val="center"/>' : ""}` +
    `${o.before || o.after ? `<w:spacing${o.before ? ` w:before="${o.before}"` : ""}${o.after ? ` w:after="${o.after}"` : ""}/>` : ""}` +
    `${o.page ? '<w:pageBreakBefore/>' : ""}</w:pPr>` +
    (text === "" ? "" :
      `<w:r><w:rPr>${o.b ? "<w:b/>" : ""}${o.i ? "<w:i/>" : ""}` +
      `<w:sz w:val="${o.sz || 22}"/></w:rPr>` +
      `<w:t xml:space="preserve">${xe(text)}</w:t></w:r>`) + `</w:p>`;

  let body = P("", {before: 2400})
           + P(d.title, {center: true, b: true, sz: 52})
           + (d.subtitle ? P(d.subtitle, {center: true, i: true, sz: 28, before: 160}) : "")
           + (d.author ? P(d.author, {center: true, sz: 24, before: 480}) : "");

  d.pieces.forEach(p => {
    body += P(p.t, {page: true, b: true, sz: 34, after: 240});
    p.body.split(/\n{2,}/).forEach(par => {
      const t = par.replace(/\s*\n\s*/g, " ").trim();
      if(t) body += P(t, {after: 160});
    });
  });

  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:body>${body}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>
<w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/></w:sectPr></w:body></w:document>`;

  const ct = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`;

  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  return zipBlob([
    {name: "[Content_Types].xml", body: ct},
    {name: "_rels/.rels", body: rels},
    {name: "word/document.xml", body: doc},
  ], "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
}

/* ---- .pdf : written object by object ---- */

// Helvetica is one of the fourteen faces every reader has, so nothing needs
// embedding. Widths are approximated -- a manuscript wants a readable measure,
// not justified type.
const PW = 595, PH = 842, MG = 64;
function wrap(text, size, width){
  const max = Math.floor(width / (size * 0.5));
  const out = [];
  for(const para of String(text).split(/\n/)){
    const ws = para.trim().split(/\s+/).filter(Boolean);
    if(!ws.length){ out.push(""); continue; }
    let line = "";
    for(const w of ws){
      if(line && (line + " " + w).length > max){ out.push(line); line = w; }
      else line = line ? line + " " + w : w;
    }
    if(line) out.push(line);
  }
  return out;
}
const pdfStr = s => String(s)
  .replace(/[‘’]/g, "'").replace(/[“”]/g, '"')
  .replace(/[–—]/g, "-").replace(/…/g, "...")
  .replace(/[\\()]/g, m => "\\" + m)
  .replace(/[^\x20-\x7e]/g, "?");

function pdfBlob(d){
  const pages = [];          // each: array of {x, y, size, bold, text}
  let cur = [], y = 0;
  const newPage = () => { cur = []; pages.push(cur); y = PH - MG - 20; };

  // title page
  newPage();
  y = PH * 0.62;
  cur.push({x: null, y, size: 26, bold: true, text: d.title});
  if(d.subtitle){ y -= 34; cur.push({x: null, y, size: 13, bold: false, text: d.subtitle}); }
  if(d.author){ y -= 60; cur.push({x: null, y, size: 12, bold: false, text: d.author}); }

  d.pieces.forEach(p => {
    newPage();
    y = PH - MG - 40;
    wrap(p.t, 17, PW - 2 * MG).forEach(l => {
      cur.push({x: MG, y, size: 17, bold: true, text: l}); y -= 24;
    });
    y -= 14;
    p.body.split(/\n{2,}/).forEach(par => {
      const lines = wrap(par.replace(/\s*\n\s*/g, " ").trim(), 11, PW - 2 * MG);
      for(const l of lines){
        if(y < MG + 30){ newPage(); y = PH - MG; }
        if(l) cur.push({x: MG, y, size: 11, bold: false, text: l});
        y -= 16;
      }
      y -= 8;
    });
  });

  const streams = pages.map((items, i) => {
    let s = "";
    for(const it of items){
      const f = it.bold ? "/F2" : "/F1";
      const t = pdfStr(it.text);
      // A null x means centred: Helvetica averages about half the point size.
      const x = it.x === null ? Math.max(MG, (PW - t.length * it.size * 0.5) / 2) : it.x;
      s += `BT ${f} ${it.size} Tf ${x.toFixed(1)} ${it.y.toFixed(1)} Td (${t}) Tj ET\n`;
    }
    if(i > 0) s += `BT /F1 9 Tf ${(PW / 2 - 8).toFixed(1)} ${(MG - 24).toFixed(1)} Td (${i}) Tj ET\n`;
    return s;
  });

  // object 1 catalog, 2 pages, 3 F1, 4 F2, then page/content pairs
  const objs = [];
  const nPages = pages.length;
  const kids = [];
  for(let i = 0; i < nPages; i++) kids.push(`${5 + i * 2} 0 R`);
  objs.push(`<< /Type /Catalog /Pages 2 0 R >>`);
  objs.push(`<< /Type /Pages /Kids [${kids.join(" ")}] /Count ${nPages} >>`);
  objs.push(`<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>`);
  objs.push(`<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>`);
  for(let i = 0; i < nPages; i++){
    objs.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] ` +
              `/Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6 + i * 2} 0 R >>`);
    objs.push(`<< /Length ${streams[i].length} >>\nstream\n${streams[i]}endstream`);
  }

  let out = "%PDF-1.4\n";
  const offs = [];
  objs.forEach((o, i) => { offs.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
  const xref = out.length;
  out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n`;
  offs.forEach(o => { out += String(o).padStart(10, "0") + " 00000 n \n"; });
  out += `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;

  const bytes = new Uint8Array(out.length);
  for(let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 255;
  return new Blob([bytes], {type: "application/pdf"});
}

/* ============ THE WALL ============ */
function wallWords(){
  const w = S.wins || [];
  if(!w.length) return `<p class="sub" style="margin:0">No wins recorded yet. Add one below —
    the map builds itself as you do.</p>`;
  const max = Math.max(...w.map(x => +x.w || 1));
  // Shuffled by a stable hash so it reads as a map, not a ranked table.
  return `<div class="cloud">` + w.map((x,i) => {
    const s = 13 + ((+x.w||1)/max) * 26;
    const o = 0.45 + ((+x.w||1)/max) * 0.55;
    return `<span style="font-size:${s.toFixed(1)}px;opacity:${o.toFixed(2)}"
      title="${esc(x.n||"")}">${esc(x.t)}</span>`;
  }).join("") + `</div>`;
}

function wall(){
  S.wins = S.wins || [];
  S.wall = S.wall || [];
  $("#v-wall").innerHTML = `
    <p class="lede">Wall of fame</p>
    <p class="sub">What you actually did. On the days the ladder looks long, this is the page to open —
      it is the only honest argument that you can do hard things, because you already have.</p>

    <div class="card">
      <div class="lbl">The map</div>
      ${wallWords()}
      <div class="row" style="margin-top:16px">
        <input id="winT" placeholder="A win, in two or three words" style="flex:1;min-width:180px">
        <input id="winW" type="number" min="1" max="10" value="5" title="How much it mattered, 1–10" style="max-width:96px">
        <input id="winN" placeholder="The detail, for you" style="flex:1;min-width:180px">
        <button class="act" id="winAdd">Add</button>
      </div>
      ${S.wins.length?`<div class="row" style="margin-top:12px">
        ${S.wins.map((x,i)=>`<span class="chipx">${esc(x.t)}
          <button class="x" data-wdel="${i}">×</button></span>`).join("")}</div>`:""}
    </div>

    <div class="card" style="margin-top:14px">
      <div class="lbl">Evidence</div>
      <p class="sub" style="margin:-2px 0 12px">Photographs, certificates, a message someone sent you.
        Images are resized in your browser before they are saved; a PDF is kept whole and shown
        as its first page. Everything here stays on your own server.</p>
      <div class="row">
        <label class="mini" style="cursor:pointer">+ Add image
          <input type="file" id="wallImg" accept="image/*" multiple hidden></label>
        <label class="mini" style="cursor:pointer">+ Add PDF
          <input type="file" id="wallPdf" accept="application/pdf" multiple hidden></label>
        <button class="mini" id="wallNote">+ Add a note</button>
        <span class="gapnote" id="wallRoom" style="margin:0">${storeRoom()}</span>
      </div>
      <div class="wallgrid" id="wallGrid">
        ${S.wall.map((it,i)=>`<figure class="wallit${it.pdf?" ispdf":""}">
          ${it.img?`<img src="${it.img}" alt="">`:""}
          ${it.pdf?`<div class="pdfbox" data-pdf="${i}">
            <div class="pdfload">opening…</div></div>`:""}
          <figcaption>${esc(it.t||"")}
            ${it.pdf?`<button class="mini pdfopen" data-popen="${i}">open</button>`:""}
            <button class="x" data-idel="${i}">×</button></figcaption>
        </figure>`).join("") || `<p class="sub" style="margin:0">Nothing here yet.</p>`}
      </div>
    </div>`;

  $("#winAdd").onclick = () => {
    const t = $("#winT").value.trim(); if(!t) return;
    S.wins.push({t, w: +$("#winW").value || 5, n: $("#winN").value.trim()});
    save(); wall();
  };
  $$("#v-wall [data-wdel]").forEach(b => b.onclick = () => {
    S.wins.splice(+b.dataset.wdel,1); save(); wall(); });
  $$("#v-wall [data-idel]").forEach(b => b.onclick = () => {
    S.wall.splice(+b.dataset.idel,1); save(); wall(); });
  $("#wallNote").onclick = () => {
    const t = prompt("What happened?"); if(t && t.trim()){ S.wall.unshift({t:t.trim()}); save(); wall(); }
  };
  $("#wallImg").onchange = e => { addImages(e.target.files); e.target.value = ""; };
  $("#wallPdf").onchange = e => { addPdfs(e.target.files); e.target.value = ""; };

  // Blob URLs rather than the data: URI itself. Chrome refuses to render a
  // data: PDF in a frame, and a blob is same-origin, so the browser's own
  // viewer takes it -- which is the whole preview, with no library to load.
  $$("#v-wall [data-pdf]").forEach(box => {
    const it = S.wall[+box.dataset.pdf];
    const u = blobUrl(it && it.pdf);
    box.innerHTML = u
      ? `<embed src="${u}#toolbar=0&navpanes=0&view=FitH" type="application/pdf">`
      : `<div class="pdfload">could not open</div>`;
  });
  $$("#v-wall [data-popen]").forEach(b => b.onclick = () => {
    const u = blobUrl(S.wall[+b.dataset.popen].pdf);
    if(u) window.open(u, "_blank", "noopener");
  });
}

/* Everything lives in one JSON document with a hard ceiling on the server, so
   the page shows the budget rather than letting a save fail silently. */
const STORE_CEILING = 12_000_000;
const PDF_MAX = 2_500_000;              // one certificate, comfortably

function storeBytes(){
  try { return new Blob([JSON.stringify(S)]).size; } catch(e){ return 0; }
}
function storeRoom(){
  const mb = n => (n/1e6).toFixed(1);
  return `${mb(storeBytes())} MB of ${mb(STORE_CEILING)} MB used`;
}

const _blobs = new Map();
function blobUrl(dataUri){
  if(!dataUri) return "";
  if(_blobs.has(dataUri)) return _blobs.get(dataUri);
  try{
    const b64 = dataUri.slice(dataUri.indexOf(",") + 1);
    const bin = atob(b64), arr = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const u = URL.createObjectURL(new Blob([arr], {type: "application/pdf"}));
    _blobs.set(dataUri, u);
    return u;
  }catch(e){ return ""; }
}

/* A PDF is kept whole -- a certificate is the document, not a picture of one.
   It is checked against the remaining room BEFORE it is added, because the
   server rejects an oversized document outright and the failure would
   otherwise arrive as a silent "not saved". */
function addPdfs(files){
  const room = () => STORE_CEILING - storeBytes() - 400_000;   // headroom
  const msg = t => { const el = $("#wallRoom"); if(el) el.textContent = t; };
  [...files].slice(0, 6).forEach(f => {
    if(f.type !== "application/pdf" && !/\.pdf$/i.test(f.name)) return;
    if(f.size > PDF_MAX)
      return msg(`${f.name} is ${(f.size/1e6).toFixed(1)} MB — 2.5 MB is the limit for one file`);
    const r = new FileReader();
    r.onload = () => {
      const uri = r.result;
      if(uri.length > room())
        return msg(`no room left for ${f.name} — remove something first (${storeRoom()})`);
      S.wall.unshift({pdf: uri, t: f.name.replace(/\.pdf$/i, ""), size: f.size});
      save(); wall();
    };
    r.readAsDataURL(f);
  });
}

/* Resized here, before anything is sent: a phone photograph is several
   megabytes and the store is one document. 900px wide is more than a wall
   tile ever needs. */
function addImages(files){
  [...files].slice(0, 6).forEach(f => {
    if(!f.type.startsWith("image/")) return;
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const max = 900, sc = Math.min(1, max/Math.max(im.width, im.height));
        const c = document.createElement("canvas");
        c.width = Math.round(im.width*sc); c.height = Math.round(im.height*sc);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        S.wall.unshift({img: c.toDataURL("image/jpeg", 0.72), t: f.name.replace(/\.[^.]+$/,"")});
        save(); wall();
      };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  });
}


/* ============ GOOD NEWS ============
   Public RSS, read on the server and filtered towards success, growth and
   life. Headlines and links only -- the article belongs to whoever wrote it,
   and this page's job is to point you at them.

   The filter is keyword-based, which is crude. It errs towards holding things
   back: a page of good news that lets one grim headline through has failed at
   the only thing it was for. */
let NEWS_CACHE = null;
async function news(force){
  const el = $("#v-news");
  if(!el) return;
  if(!NEWS_CACHE || force){
    el.innerHTML = `<p class="lede">Good news</p><p class="sub">Reading the feeds…</p>`;
    try{ NEWS_CACHE = await fetch("/api/news").then(r=>r.json()); }
    catch(e){ NEWS_CACHE = {ok:false}; }
  }
  const d = NEWS_CACHE;
  if(!d || !d.ok || !(d.items||[]).length){
    el.innerHTML = `<p class="lede">Good news</p>
      <p class="sub">Nothing came back from the feeds just now. It refreshes every half hour.</p>
      <button class="mini" id="nRe">Try again</button>`;
    const b=$("#nRe"); if(b) b.onclick=()=>news(true);
    return;
  }
  const order = ["Technology","Indian companies","Health","Life","Entertainment"];
  const by = {};
  d.items.forEach(i => (by[i.cat] = by[i.cat] || []).push(i));
  el.innerHTML = `
    <p class="lede">Good news</p>
    <p class="sub">Success, growth and life — filtered from public feeds. Headlines link to the
      publisher; nothing is reproduced here. ${d.kept||d.items.length} of ${d.scanned||"?"} headlines got through.</p>
    <div class="row" style="margin-bottom:8px"><button class="mini" id="nRe">Refresh</button>
      <span class="gapnote">Cached for thirty minutes so the feeds are not hammered.</span></div>
    ${order.filter(c=>by[c]).map(c=>`
      <div class="ncat">${esc(c)}</div>
      <div class="card">${by[c].slice(0,14).map(i=>`
        <div class="nrow">
          <span class="nsrc">${esc(i.src)}</span>
          <a href="${esc(i.u)}" target="_blank" rel="noopener">${esc(i.t)}</a>
        </div>`).join("")}</div>`).join("")}`;
  $("#nRe").onclick = () => news(true);
}

/* boot */
load();
if(localStorage.getItem("ladder.tone")==="1"){
  window.addEventListener("pointerdown",()=>toneToggle(true),{once:true});
}
